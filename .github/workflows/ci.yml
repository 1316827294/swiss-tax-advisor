name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run tax calculation tests
      run: |
        python3 -m unittest discover -s scripts -p "test_*.py"

    - name: Test user profile CLI smoke test
      run: |
        python3 scripts/user_profile.py status
        python3 scripts/user_profile.py set profile '{"address": {"canton": "ZH", "commune": "Zürich", "postal_code": "8001"}}'
        python3 scripts/user_profile.py get profile
        python3 scripts/user_profile.py status
