name: 💡 Feature Request
description: Suggest an idea or enhancement for Swiss Tax Advisor
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the limitation or pain point is.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like this feature to behave.
    validations:
      required: true
  - type: checkboxes
    id: platform_relevance
    attributes:
      label: Affected AI Platforms
      options:
        - label: Claude Code
        - label: Cursor
        - label: GitHub Copilot
        - label: Cline / Roo Code
        - label: Windsurf
        - label: Aider / Devin
        - label: Google Antigravity
