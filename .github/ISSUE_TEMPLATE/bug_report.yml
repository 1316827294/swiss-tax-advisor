name: 🐛 Bug Report
description: Create a report to help us fix an incorrect calculation or script issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please ensure that you do not include any real personal or confidential tax data (names, social security numbers, real AHV numbers).
  - type: input
    id: canton_commune
    attributes:
      label: Canton & Commune
      description: Which canton and commune does this calculation issue affect?
      placeholder: e.g. Canton Zurich, Commune Zürich (8001)
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Output
      description: What was calculated, and what does the official cantonal tax calculator output?
      placeholder: |
        Expected: Federal Tax CHF 1,240.00 (from official calculator)
        Actual: Federal Tax CHF 1,180.00
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Which platform or script command was run?
      placeholder: |
        1. Set user profile: Canton ZH, single earner
        2. Set taxable income: CHF 100,000
        3. Run calculation
    validations:
      required: false
